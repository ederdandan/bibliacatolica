  <script>
    // Aplica estilo e cor antes da primeira pintura (evita "piscar").
    (function () {
      var s = {}, lit = '';
      try {
        s = (JSON.parse(localStorage.getItem('biblia:v1')) || {}).settings || {};
        lit = localStorage.getItem('biblia:lit') || '';
      } catch (e) {}
      var st = s.theme === 'vitral' || s.theme === 'noturno' ? s.theme
        : s.theme === 'light' || s.theme === 'sepia' ? 'vitral'
        : s.theme === 'dark' || s.theme === 'black' ? 'noturno'
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'noturno' : 'vitral';
      var c = s.color || 'liturgical';
      if (c === 'liturgical') c = lit || 'verde';
      if (c === 'style') c = st === 'noturno' ? 'dourado' : 'roxo';
      document.documentElement.dataset.style = st;
      document.documentElement.dataset.color = c;
    })();
  </script>

  <header class="topbar" id="topbar">

      <span class="brand-name">Estudo Bíblico Católico</span>

    <button class="ref-btn" id="ref-btn" type="button" hidden aria-haspopup="dialog">
      <span id="ref-label"></span>
      <svg class="ic sm"><use href="#i-down"/></svg>
    </button>
    <div class="top-actions">

  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <section class="tts-bar" id="tts-bar" hidden aria-label="Leitura em voz alta">

  </section>

    </div>

    <div class="vb-actions">
      <button type="button" data-act="bookmark"><svg class="ic"><use href="#i-bookmark"/></svg><span>Favoritar</span></button>

    </div>

  </dialog>
